name: iOS Pull Request

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness sensors (drafts and ready PRs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Pull Request Name
        id: versioning
        uses: Oliver-Binns/Versioning@main
        with:
          ACTION_TYPE: 'Validate'

      - name: Check architecture boundaries
        run: ./scripts/check-architecture.sh

      - name: Test Apple toolchain preflight
        run: python3 -B -m unittest discover -s scripts/tests

  build:
    name: Apple validation (draft builds; ready PR tests)
    permissions:
      contents: read
    uses: ./.github/workflows/apple-validation.yml
    with:
      lane: ${{ github.event.pull_request.draft && 'buildForTesting' || 'runUnitTests' }}
