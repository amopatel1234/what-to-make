name: iOS Pull Request

on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness sensors (drafts and ready PRs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Pull Request Name
        id: versioning
        uses: Oliver-Binns/Versioning@main
        with:
          ACTION_TYPE: 'Validate'

      - name: Check architecture boundaries
        run: ./scripts/check-architecture.sh

  build:
    # Runner image YAML label `xcode-27` is the official GitHub-hosted image that
    # ships Xcode 27 + iOS 27 SDKs (public preview). See:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    # https://github.com/actions/runner-images#available-images
    name: Build, unit, and snapshot tests (Xcode 27 / iOS 27)
    if: github.event.pull_request.draft == false
    runs-on: xcode-27

    steps:
      - name: Add path globally
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Checkout
        uses: actions/checkout@v4

      # Default on this image is Xcode 27.0 at /Applications/Xcode_27.app
      # (see actions/runner-images images/macos/xcode-27-arm64-Readme.md).
      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app

      - name: Show selected Xcode toolchain and SDKs
        run: |
          set -euo pipefail
          echo "== xcode-select =="
          xcode-select -p
          echo
          echo "== xcodebuild -version =="
          xcodebuild -version
          echo
          echo "== xcodebuild -showsdks =="
          xcodebuild -showsdks
          echo
          echo "== available iOS simulators =="
          xcrun simctl list devices available

      - name: Run unit and snapshot tests
        env:
          WORKSPACE: ${{ github.workspace }}
          WORKSPACE_FILENAME: "whattomake.xcworkspace"
          SCHEME: "whattomake"
          TEST_PLAN: "UnitTestsPlan"
          # iPhone 17 Pro is not installed on the xcode-27 image; iPhone 17 + iOS 27.0 is
          # (actions/runner-images xcode-27-arm64-Readme.md → Installed Simulators).
          TEST_DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=27.0"
          # First xcodebuild -showBuildSettings on this image can exceed Fastlane's
          # default 3s base timeout (observed in CI on this branch).
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
        run: fastlane runUnitTests

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: fastlane/test_output/
          if-no-files-found: ignore
