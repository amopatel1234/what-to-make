name: Merged

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate an unsigned Release build without creating a release or uploading to TestFlight
        type: boolean
        default: true

jobs:
  validate:
    name: Validate release build without publishing
    if: github.event_name == 'workflow_dispatch' && inputs.validate_only
    permissions:
      contents: read
    uses: ./.github/workflows/apple-validation.yml
    with:
      lane: validateRelease

  build:
    name: Build app and deploy
    if: github.event_name == 'push' || !inputs.validate_only
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "4"
    permissions:
      contents: write

    steps:
      - name: Require main for publishing
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publishing is restricted to main. Use validate_only=true to check a feature branch."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install locked Fastlane dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler: '2.6.9'
          bundler-cache: true

      - name: Increment Version
        id: versioning
        uses: Oliver-Binns/Versioning@main
        with:
          ACTION_TYPE: 'Release'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Distribution P12
        if: steps.versioning.outputs.release_version != ''
        run: |
          if [ -z "$CERTIFICATE_VALUE" ]; then
            echo "Error: DISTRIBUTION_CERTIFICATE secret is not set"
            exit 1
          fi
          echo -n "$CERTIFICATE_VALUE" | base64 --decode -o distribution.p12
        env:
          CERTIFICATE_VALUE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}

      - name: Deploy
        if: steps.versioning.outputs.release_version != ''
        run: bundle exec fastlane deploy
        env:
          ISSUER_ID: "69a6de86-2dd0-47e3-e053-5b8c7c11a4d1"
          KEY_ID: "6986A95Z65"
          KEY_VALUE: ${{ secrets.KEY_VALUE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_PASSWORD }}
          RELEASE_VERSION: ${{ steps.versioning.outputs.release_version }}
